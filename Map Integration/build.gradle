plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/mapintegration.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modCompileOnly files('../libs/xaeroworldmap-fabric-1.21.11-1.44.2.jar')
    modCompileOnly files('../libs/xaerominimap-fabric-1.21.11-26.4.2.jar')
    modCompileOnly files('../libs/xaerolib-fabric-1.21.11-1.7.1.jar')
}

processResources {
    inputs.properties([
            "version": project.version,
            "mc_version": project.minecraft_version
    ])

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
    it.options.release = 21
}
