name: Build Chuck Pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version (used for the artifact name)'
        required: false
        default: '1.0.78'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build
        run: gradle build -x test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chuckpack-${{ inputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
