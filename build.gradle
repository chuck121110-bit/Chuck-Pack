plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url "https://maven.meteordev.org/releases"}
    maven { url "https://maven.meteordev.org/snapshots" }
    maven { url "https://maven.duti.dev/releases" }
}

loom {
    accessWidenerPath = file("src/main/resources/aeropack.accesswidener")
}

configurations {
    extraLibs
    implementation.extendsFrom(extraLibs)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"

    // Baritone (required runtime dependency)
    modImplementation files('libs/baritone-meteor-26.1.2.jar')

    // Xaero's World Map + Minimap (required for AutoFly "Fly Here" button)
    modCompileOnly files('libs/xaeroworldmap-fabric-26.1.2-1.44.2.jar')
    modCompileOnly files('libs/xaerominimap-fabric-26.1.2-26.4.2.jar')

    // Cubiomes native bindings (HawtJNI, natives auto-loaded from META-INF/native)
    extraLibs "dev.duti.acheong:cubiomes:1.22.5"
    extraLibs "dev.duti.acheong:cubiomes:1.22.5:windows64"
    extraLibs "dev.duti.acheong:cubiomes:1.22.5:linux64"
    extraLibs "dev.duti.acheong:cubiomes:1.22.5:osx"
}

jar {
    from {
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.properties([
            "version": project.version,
            "mc_version": project.minecraft_version
    ])

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}
