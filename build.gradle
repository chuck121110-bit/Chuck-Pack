plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url "https://maven.meteordev.org/releases"}
    maven { url "https://maven.meteordev.org/snapshots" }
    maven {
        url "https://maven.duti.dev/releases"
        content {
            includeGroup "dev.duti.acheong"
            includeGroupByRegex "org\\.fusesource.*"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/chuckpack.accesswidener")
}

configurations {
    extraLibs
    implementation.extendsFrom(extraLibs)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"

    // Baritone (required runtime dependency)
    implementation files('libs/baritone-meteor-1.21.11.jar')

    // Xaero's World Map + Minimap (compile-only, for "Auto Fly Here" button)
    compileOnly files('libs/xaeroworldmap-fabric-26.1.2-1.44.2.jar')
    compileOnly files('libs/xaerominimap-fabric-26.1.2-26.4.2.jar')

    // Fabric resource loader (needed for DataResourceStore used by ServerLevel)
    compileOnly files('C:/Users/Chuck/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-resource-loader-v1/2.0.9+d871b99e4c/adc76cbab1a71ba7802c59fc44c18f3351f14b34/fabric-resource-loader-v1-2.0.9+d871b99e4c.jar')

    // Cubiomes native bindings (HawtJNI, natives auto-loaded from META-INF/native)
    extraLibs("dev.duti.acheong:cubiomes:1.22.5") {
        exclude group: "net.minecraft"
        exclude group: "com.mojang"
    }
    extraLibs("dev.duti.acheong:cubiomes:1.22.5:windows64") {
        exclude group: "net.minecraft"
        exclude group: "com.mojang"
    }
    extraLibs("dev.duti.acheong:cubiomes:1.22.5:linux64") {
        exclude group: "net.minecraft"
        exclude group: "com.mojang"
    }
    extraLibs("dev.duti.acheong:cubiomes:1.22.5:osx") {
        exclude group: "net.minecraft"
        exclude group: "com.mojang"
    }
}

jar {
    from {
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.properties([
            "version": project.version,
            "mc_version": project.minecraft_version
    ])

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
    it.options.release = 25
}
